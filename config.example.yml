name: Universal Memory MCP
vault_root: ./vault
read_only: true
# There is no SQL index. The search index is rebuilt in memory from Markdown.
audit_dir: ./.state/audit
transport: stdio
# MCP catalog. full (default) keeps every current tool name.
# minimal: everyday read/write. standard: minimal plus graph, claims, and sources.
# Override without editing this file: MEMORY_TOOLSET=minimal|standard|full
toolset: full
# Repeat the generic result envelope as outputSchema. On by default.
# Set false (or MEMORY_OUTPUT_SCHEMA=false) to shrink tools/list.
advertise_output_schema: true
http:
  bind: 127.0.0.1
  port: 3333
  allowed_origins: []
  bearer_token_env: MEMORY_API_TOKEN
# Experimental. Off by default. See docs/neural-memory.md.
neural:
  enabled: false
  base_url: http://127.0.0.1:8091
  bearer_token_env: MEMORY_API_TOKEN
  timeout_ms: 1500
  # Vector hits must score strictly above this. 0 drops negative cosine padding.
  # The sidecar's own fallback, when a request omits min_score, is BDH_VECTOR_MIN_SCORE.
  vector_min_score: 0
routing:
  project:
    backend: markdown
    path: "02 Projects/{slug}/index.md"
  person:
    backend: markdown
    path: "People/{slug}.md"
  note:
    backend: markdown
    path: "03 Knowledge/{slug}.md"
  knowledge:
    backend: markdown
    path: "03 Knowledge/{slug}.md"
  inbox:
    backend: markdown
    path: "01 Inbox/{date}-{slug}.md"
  memory:
    backend: markdown
    path: "03 Knowledge/{slug}.md"
  source:
    backend: markdown
    path: "Sources/{provider}/{date}-{slug}.md"
