name: Universal Memory MCP
vault_root: ./vault
read_only: true
# There is no SQL index. The search index is rebuilt in memory from Markdown.
audit_dir: ./.state/audit
transport: stdio
# MCP catalog. full (the default) keeps every tool name. standard is the smaller everyday set.
# lazy hides full-only groups behind tool_groups. Discovery defaults to eager.
# MEMORY_VERBOSE_SCHEMA=1 restores the previous JSON Schema shape.
# MEMORY_RESPONSE=full restores full entities, meta, and structuredContent.
toolset: full
# tool_discovery: eager
# verbose_schema: false
# response: compact
# outputSchema is on by default. Low-token opt-in:
#   MEMORY_TOOLSET=standard MEMORY_RESPONSE=compact MEMORY_OUTPUT_SCHEMA=false
advertise_output_schema: true
http:
  bind: 127.0.0.1
  port: 3333
  allowed_origins: []
  # On a non-loopback bind, set this to also restrict the Host header.
  # Unset: any Host is accepted (the bearer token is required). Browser Origin
  # is still limited to localhost unless allowed_origins lists more names.
  # MEMORY_HTTP_ALLOW_ANY_HOST=1 turns both checks off.
  # allowed_hosts: []
  bearer_token_env: MEMORY_API_TOKEN
# Follow symlinks inside the vault. Off: a directory symlink must not redirect
# writes outside the vault. MEMORY_ALLOW_SYMLINKS=1 opts in.
# follow_symlinks: false
# Experimental. Off by default. See docs/neural-memory.md.
neural:
  enabled: false
  base_url: http://127.0.0.1:8091
  bearer_token_env: MEMORY_API_TOKEN
  timeout_ms: 1500
  # Vector hits must score strictly above this. 0 drops negative cosine padding.
  # The sidecar's own fallback, when a request omits min_score, is BDH_VECTOR_MIN_SCORE.
  vector_min_score: 0
# Periodic self-check. Off by default. Writes a report and dry-run changesets
# under audit_dir only. Never applies them and never edits the vault.
# MEMORY_HEALTH_INTERVAL_HOURS overrides interval_hours. The timer runs only
# for `serve` when transport is http (not stdio).
health:
  enabled: false
  interval_hours: 24
  startup_delay_s: 60
  max_changesets: 5
# Park creates whose classification score is below this. Default 0.5 parks
# only low (0.3). medium (0.6) and a confident create (1) keep their type.
# MEMORY_INBOX_CONFIDENCE_THRESHOLD overrides this.
# classification:
#   inbox_confidence_threshold: 0.5
# Ranking weights are divided by their sum. match 1 keeps a better text hit
# ahead of recency 0.15, links 0.1, and usage 0.05. Half-life is 30 days.
# track_usage writes audit_dir/usage.json (recall/get counts), never Markdown.
# MEMORY_TRACK_USAGE and MEMORY_RANK_MATCH / _RECENCY / _LINKS / _USAGE /
# MEMORY_RANK_HALF_LIFE_DAYS override the file.
# ranking:
#   track_usage: false
#   half_life_days: 30
#   weights:
#     match: 1
#     recency: 0.15
#     links: 0.1
#     usage: 0.05
routing:
  project:
    backend: markdown
    path: "02 Projects/{slug}/index.md"
  person:
    backend: markdown
    path: "People/{slug}.md"
  note:
    backend: markdown
    path: "03 Knowledge/{slug}.md"
  knowledge:
    backend: markdown
    path: "03 Knowledge/{slug}.md"
  inbox:
    backend: markdown
    path: "01 Inbox/{date}-{slug}.md"
  memory:
    backend: markdown
    path: "03 Knowledge/{slug}.md"
  source:
    backend: markdown
    path: "Sources/{provider}/{date}-{slug}.md"
  decision:
    backend: markdown
    path: "10 Decisions/{slug}.md"
  topic:
    backend: markdown
    path: "03 Knowledge/Topics/{slug}.md"
  task:
    backend: markdown
    path: "11 Tasks/{slug}.md"
  idea:
    backend: markdown
    path: "08 Ideas/{slug}.md"
  event:
    backend: markdown
    path: "14 Events/{date}-{slug}.md"
  preference:
    backend: markdown
    path: "15 Preferences/{slug}.md"
  fact:
    backend: markdown
    path: "16 Facts/{slug}.md"
  conversation:
    backend: markdown
    path: "17 Conversations/{date}-{slug}.md"
  project_decision:
    backend: markdown
    path: "02 Projects/{project_slug}/decisions/{date}-{slug}.md"
  folder_collection:
    backend: markdown
    path: "{collection_path}/index.md"
  agent_identity:
    backend: markdown
    path: "Agents/{agent_id}/identity.en.md"
  agent_identity_cs:
    backend: markdown
    path: "Agents/{agent_id}/identity.cs.md"
  agent_soul:
    backend: markdown
    path: "Agents/{agent_id}/soul.en.md"
  agent_soul_cs:
    backend: markdown
    path: "Agents/{agent_id}/soul.cs.md"
  agent_role:
    backend: markdown
    path: "Agents/{agent_id}/roles/{role_id}.en.md"
  agent_role_cs:
    backend: markdown
    path: "Agents/{agent_id}/roles/{role_id}.cs.md"
