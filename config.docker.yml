# Universal Memory MCP – configuration used inside the container.
# Paths are container paths: mount the vault at /vault and persistent state at /state.
name: Universal Memory MCP
vault_root: /vault
read_only: false
audit_dir: /state/audit
transport: http
http:
  # 0.0.0.0 inside the container so the published port works. Host and Origin
  # are still limited to localhost unless allowed_hosts is set or
  # MEMORY_HTTP_ALLOW_ANY_HOST=1. Compose publishes 127.0.0.1 by default.
  bind: 0.0.0.0
  port: 27123
  allowed_origins: []
  bearer_token_env: MEMORY_API_TOKEN
# Experimental BDH sidecar. It runs inside this container (docker-entrypoint.sh, UMM_NEURAL=0 turns it off).
neural:
  enabled: true
  base_url: http://127.0.0.1:8091
  bearer_token_env: MEMORY_API_TOKEN
  timeout_ms: 120000
# Same self-check as config.example.yml. Off until an operator turns it on.
# MEMORY_HEALTH_INTERVAL_HOURS overrides interval_hours.
health:
  enabled: false
  interval_hours: 24
  startup_delay_s: 60
  max_changesets: 5
