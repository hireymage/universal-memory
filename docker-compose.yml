# Universal Memory MCP in Docker (one container, one port).
# 1. cp .env.example .env and set UMM_VAULT_PATH (+ optionally UMM_PORT, UMM_TOKEN_FILE)
# 2. put a strong token (>= 32 chars, one line) into the file UMM_TOKEN_FILE points to
# 3. docker compose up -d --build
# UMM_NEURAL=0 turns the experimental BDH sidecar off inside the container.
name: universal-memory

services:
  universal-memory:
    build:
      context: .
      target: runtime
    image: universal-memory-mcp:${UMM_IMAGE_TAG:-local}
    container_name: universal-memory-mcp
    restart: unless-stopped
    init: true
    environment:
      MEMORY_API_TOKEN_FILE: /run/secrets/memory_api_token
      UMM_NEURAL: ${UMM_NEURAL:-1}
      BDH_NEURONS: ${BDH_NEURONS:-4096}
      # Dense-vector layer (third result list). Off by default; BDH_VECTOR=1 turns it on.
      BDH_VECTOR: ${BDH_VECTOR:-0}
      # Cosine floor for vector hits. Scores must be strictly above this (default 0 drops negatives).
      BDH_VECTOR_MIN_SCORE: ${BDH_VECTOR_MIN_SCORE:-0}
      # Separate state per neuron count: the old 1024-neuron state is kept untouched beside it.
      BDH_STATE_DIR: /state/neural-${BDH_NEURONS:-4096}
    secrets:
      - memory_api_token
    ports:
      - "${UMM_BIND:-127.0.0.1}:${UMM_PORT:-27123}:27123"
    volumes:
      - type: bind
        source: ${UMM_VAULT_PATH:?set UMM_VAULT_PATH in .env}
        target: /vault
      - umm-state:/state
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  memory_api_token:
    file: ${UMM_TOKEN_FILE:-./secrets/memory_api_token}

volumes:
  umm-state:
